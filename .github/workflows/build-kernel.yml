name: Build excalibur Kernel

on:
  push:
    branches:
      - curtana
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git liblz4-tool libncurses-dev libssl-dev make zip zlib1g-dev python3 device-tree-compiler
        
    - name: Setup Proton Clang Toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
        
    - name: Compile Kernel
      run: |
        # Set environment variables for compilation
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Clean previous builds just in case
        rm -rf out
        mkdir out
        
        # Generate configuration
        make O=out ARCH=arm64 vendor/atoll-perf_defconfig
        
        # Build the kernel with strictly enforced LLVM tools
        make -j$(nproc --all) \
          O=out \
          ARCH=arm64 \
          CC=clang \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-excalibur
        path: out/arch/arm64/boot/Image.gz-dtb
