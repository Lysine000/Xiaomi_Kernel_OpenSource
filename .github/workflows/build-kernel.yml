
name: Build Excalibur Kernel (No Module Sig, Manual Defconfig Edit)

on:
  push:
    branches: [ curtana-q-oss ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev build-essential \
            libncurses5-dev python3 git wget zip curl libelf-dev

      - name: Get Clang (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          rm -f clang/bin/ld
          ln -sf llvm-ar clang/bin/aarch64-linux-android-ar
          ln -sf llvm-nm clang/bin/aarch64-linux-android-nm
          ln -sf llvm-objcopy clang/bin/aarch64-linux-android-objcopy
          ln -sf llvm-objdump clang/bin/aarch64-linux-android-objdump
          ln -sf llvm-strip clang/bin/aarch64-linux-android-strip
          ln -sf ld.lld clang/bin/aarch64-linux-android-ld
          ln -sf llvm-ar clang/bin/arm-linux-androideabi-ar
          ln -sf llvm-nm clang/bin/arm-linux-androideabi-nm
          ln -sf llvm-objcopy clang/bin/arm-linux-androideabi-objcopy
          ln -sf llvm-objdump clang/bin/arm-linux-androideabi-objdump
          ln -sf llvm-strip clang/bin/arm-linux-androideabi-strip
          ln -sf ld.lld clang/bin/arm-linux-androideabi-ld
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Checkout kernel source (this fork, already edited)
        uses: actions/checkout@v4
        with:
          path: kernel

      - name: Generate .config from atoll-perf_defconfig
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out vendor/atoll-perf_defconfig
          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel
        run: |
          set -o pipefail
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=ci
          make -j$(nproc --all) O=out \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            HOSTCFLAGS="-fcommon" \
            Image.gz-dtb \
            2>&1 | tee build.log

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          rm -rf AK3/.git
          sed -i 's/kernel.string=.*/kernel.string=Red Kernel (atoll-perf, NoSigForce)/' AK3/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=excalibur/' AK3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=curtana/' AK3/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=miatoll/' AK3/anykernel.sh
          sed -i 's/device.name4=.*/device.name4=joyeuse/' AK3/anykernel.sh
          sed -i 's/device.name5=.*/device.name5=gram/' AK3/anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=auto;|' AK3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AK3/
          cd AK3
          zip -r9 ../red-kernel.zip . -x ".git*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: red-kernel
          path: |
            red-kernel.zip
            kernel/build.log